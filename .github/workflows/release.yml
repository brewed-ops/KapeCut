name: Release

# A v* tag builds the two installers (Windows, Mac; no Linux build) into a draft Release; publishing it is a manual
# step. Each comes with its update feed (latest.yml, latest-mac.yml), which the app's updater reads only from a
# published Release of a public repo (ADR 0006).
# Run by hand (Actions > Release > Run workflow), or a PR that touches packaging, builds them as workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: [package.json, package-lock.json, .github/workflows/release.yml, scripts/smoke-packaged.mjs]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # each takes about 2 to 3 (the universal Mac build packs both arches)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag matches package.json's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run dist
      - name: The update feed is there
        shell: bash
        run: ls release/latest*.yml
      - name: The Mac update feed names the universal dmg
        if: runner.os == 'macOS'
        run: grep -q -- '-universal\.dmg' release/latest-mac.yml
      # The packaged app opens and gets to the editor. Export waits on ffmpeg, a Setup requirement neither runner image
      # has.
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: npm run smoke:packaged
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kapecut-shots-${{ matrix.os }}
          path: .scratch/packaged-*.png
          include-hidden-files: true # .scratch is a dot folder, which the upload skips by default
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kapecut-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10 # no tag run to time yet, so the build job's cap: it only downloads and uploads the installers
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A re-run finds the draft it made before and replaces its files.
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --notes "$MAC_INSTALL"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # Goes above the generated notes: the DMG is not notarized, so a browser download meets Gatekeeper.
          MAC_INSTALL: |
            **Mac (Intel or Apple silicon, one universal dmg):** install from Terminal, no Gatekeeper prompt:
            ```sh
            curl -fsSL https://kapecut.brewedops.cloud/install.sh | bash
            ```
